services:
  postgres:
    image: postgres:16
    container_name: project_management_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: project_management
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: